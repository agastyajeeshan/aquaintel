services:
  postgres:
    image: postgres:16-alpine
    container_name: aquaintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquaintel_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: aquaintel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaintel_user -d aquaintel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: aquaintel_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
      - mqttlog:/mosquitto/log

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquaintel_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://aquaintel_user:secure_password@postgres:5432/aquaintel_db"
      SECRET_KEY: "aquaintel-production-secure-random-token-change-in-production"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquaintel_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mqttdata:
  mqttlog:
